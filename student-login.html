<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login — EHSAN IELTS Mock Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="center-wrap">
  <div class="auth-card">
    <a class="link-back" href="index.html">&larr; Back</a>
    <h2>Student Login</h2>
    <p class="muted">Enter your name and pick an exam to begin.</p>
    <input type="text" id="studentNameInput" class="text-input" placeholder="Full name" autocomplete="off">
    <select id="examSelect" class="text-input"></select>
    <div id="studentLoginError" class="error-msg"></div>
    <button class="btn btn-primary" id="btnStudentSubmit">Continue</button>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/common.js"></script>
<script src="js/student-login.js"></script>
</body>
</html>
