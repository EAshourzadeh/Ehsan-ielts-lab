<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exams — EHSAN IELTS Mock Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="admin-brand">EHSAN<span>IELTS</span></div>
    <nav class="admin-nav">
      <a class="admin-nav-btn active" href="teacher-dashboard.html">Exams</a>
      <a class="admin-nav-btn" href="teacher-builder.html">Exam Builder</a>
      <a class="admin-nav-btn" href="teacher-submissions.html">Submissions</a>
      <a class="admin-nav-btn" href="teacher-grading.html">Grade Writing</a>
    </nav>
    <a class="btn sidebar-logout btn-sm" href="index.html" id="btnLogout" style="margin-top:auto;">Log Out</a>
  </aside>

  <main class="admin-main">
    <div class="settings-card">
      <h3>Teacher Settings</h3>
      <p class="muted small">Set your email so students can send their results directly to you when they finish the exam.</p>
      <div class="settings-row">
        <input type="email" id="teacherEmailInput" class="text-input" placeholder="you@school.edu">
        <button class="btn btn-primary btn-sm" id="btnSaveEmail">Save</button>
        <span id="emailSaveMsg" class="success-msg"></span>
      </div>
    </div>

    <div class="panel-head">
      <h2>Exams</h2>
      <button class="btn btn-primary btn-sm" id="btnNewExam">+ New Exam</button>
    </div>
    <div id="examList" class="exam-list"></div>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/teacher-dashboard.js"></script>
</body>
</html>
