<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Login — EHSAN IELTS Mock Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="center-wrap">
  <div class="auth-card">
    <a class="link-back" href="index.html">&larr; Back</a>
    <h2>Teacher Login</h2>
    <p class="muted">Sign in with your teacher account to manage exams.</p>
    <input type="email" id="adminEmailInput" class="text-input" placeholder="Email" autocomplete="username">
    <input type="password" id="adminPassInput" class="text-input" placeholder="Password" autocomplete="current-password">
    <div id="adminLoginError" class="error-msg"></div>
    <button class="btn btn-primary" id="btnAdminSubmit">Sign In</button>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/common.js"></script>
<script src="js/teacher-login.js"></script>
</body>
</html>
